# MKSine documentation navigation (SSG-agnostic).
# Each item is { title, path } relative to this file. SSG adapters
# (VitePress, Docusaurus, Starlight, Mintlify) consume this to build
# the sidebar; on-disk order also follows the same sequence.
#
# Invariants enforced by `php scripts/lint-docs.php` and the Pest
# `tests/DocsNavTest.php` suite:
#   1. Every .md file under docs/ (excluding archive/ and internal/)
#      appears here exactly once.
#   2. Every entry below points to an existing .md file on disk.
#   3. Every referenced page starts with YAML front matter that
#      contains a non-empty `title:` field.
# Run the lint locally before opening a PR that touches docs/.

